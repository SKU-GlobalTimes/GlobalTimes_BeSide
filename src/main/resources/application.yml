spring:
  config:
    import: "optional:file:.env[.properties]"

  #mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/${LOCAL_MYSQL_DATABASE}?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${LOCAL_MYSQL_USER}
    password: ${LOCAL_MYSQL_PASSWORD}

  #redis
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  # OAuth2 소셜 로그인 (Google)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope: profile, email

  # GPT (비활성 / 주석 보존)
  # openai:
  #   api-key: ${OPENAI_API_KEY}

  #news
  newsapi:
    api-key: ${NEWS_API_KEY}

  #google translate
  google:
    api-key: ${GOOGLE_API_KEY}

# Gemini API (GPT 대체, 무료 티어: 일 1,500회 / 분 15회)
gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 604800000  # 7일 (ms)

# OAuth2 로그인 후 FE 리다이렉트 URI
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# 뉴스 수집 활성화 여부
# false(기본): 로컬 개발 중 API 할당량 절약 목적으로 @PostConstruct/스케줄러 비활성화
# true: 수집 테스트 시에만 변경 (주의: 무료 플랜 100 req/24h 제한)
news-fetch:
  enabled: false

# 국가별 시각 비교 API: Redis 캐시 (0이면 미사용, 동일 articleId 반복 요청 시 FULLTEXT 부하 감소)
perspectives:
  cache-ttl-seconds: 3600

# 트렌드 기사 요약 캐시 (0이면 미사용, 동일 URL 반복 요청 시 GPT 호출 절감)
trend:
  summary-cache-ttl-seconds: 21600

# AI 컨텍스트 대화 슬라이딩 윈도우 크기 (최근 N턴만 Gemini에 전달, 토큰 비용 제어)
ai:
  context-window-size: 10
  summary-save-enabled: ${AI_SUMMARY_SAVE_ENABLED:true}
